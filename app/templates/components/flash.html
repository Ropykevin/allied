{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container-page pt-4 space-y-2">
      {% for category, message in messages %}
        <div class="rounded-md border px-4 py-3 text-sm
          {% if category == 'danger' %}border-red-200 bg-red-50 text-red-800
          {% elif category == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
          {% elif category == 'warning' %}border-amber-200 bg-amber-50 text-amber-900
          {% else %}border-chocolate/10 bg-white text-ink{% endif %}" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
