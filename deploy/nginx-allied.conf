# Allied Tours & Travel — Nginx reverse proxy
# Place on VPS as: /etc/nginx/sites-available/allied
#
# 1) Replace YOUR_DOMAIN with your real domain (e.g. alliedtravelke.com)
# 2) Ensure DNS A record points to this server IP
# 3) App must be listening on 127.0.0.1:10001 (WEB_PORT in .env)
# 4) After HTTP works, run certbot (see comments at bottom)

upstream allied_app {
    server 127.0.0.1:10001;
    keepalive 32;
}

# Gallery videos can be large — keep this in EVERY server block (HTTP + HTTPS).
# Certbot adds a separate 443 block; copy client_max_body_size there too if missing.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 100m;

    location / {
        proxy_pass http://allied_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# After certbot, it will usually add a separate 443 server block automatically.
# Keep TRUST_PROXY_HOPS=1 in the app .env when behind this proxy.
#
# Certbot:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
